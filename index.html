<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Интерактивный UI Kit опросов: светлая и тёмная СКОЛКА, ВДЕЛЕ. Диаграммы, формы и компоненты.">
  <meta name="color-scheme" content="light">
  <title>СКОЛКА · UI Kit опросов</title>
  <link rel="stylesheet" href="./styles.css?v=0.3">
  <script src="./echarts.min.js" defer></script>
  <script src="./app.js?v=0.5" defer></script>
</head>
<body>
  <a class="skip" href="#workspace">Перейти к примерам</a>
  <header class="kit-header"><a class="kit-brand" href="./"><img src="./logo-skolca.png" alt="СКОЛКА"></a></header>
  <main class="kit-main">
    <div class="intro"><h1>Оформление опросов</h1></div>
    <div id="themes" class="theme-list" aria-label="Темы оформления"></div>
    <nav class="kit-nav" aria-label="Разделы UI Kit"><button type="button" data-view="diagrams">Диаграммы</button><button type="button" data-view="participant">Опрос участника</button><button type="button" data-view="components">Компоненты</button><button type="button" data-view="tokens">Палитра</button></nav>
    <section id="workspace" class="workspace" aria-label="Примеры интерфейса"></section>

  </main>
  <dialog id="theme-dialog" class="theme-dialog" aria-labelledby="theme-dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
